# I-JEPA omurgalı tam koşu - predictive-SSL paradigma temsilcisi (ROADMAP Faz 1).
# Gövde: I-JEPA ViT-H/16 (HuggingFace transformers, facebook/ijepa_vith16_1k) + Simple Feature
# Pyramid (src/mtl/models/ijepa_backbone.py).
#
# ADİLLİK: patch16 varyantı BİLEREK seçildi -> img_size 512 -> 32x32 grid = DINOv1/CLIP/SAM ile
# BİREBİR aynı. (patch14 varyantı 518/37x37 isterdi -> grid confound'u.) batch_size da 4:
# cached eğitimde ViT koşmaz, VRAM'i neck+head belirler -> diğerleriyle aynı batch sığar.
#
# ⚠️ KALAN TEK CONFOUND: ViT-H (632M) vs diğerleri ViT-B (~86M). Meta I-JEPA'nın ViT-B'sini
# yayınlamadı -> düzeltilemez; sonucu "boyut avantajı" notuyla raporla.
# ⚠️ `transformers` gerekli (notebook hücresi pip install yapar). Cache ~59 GB.
data:
  ann_file: data/coco_subset/annotations/instances_train_subset.json
  img_dir: data/coco_subset/images/train
  val_ann_file: data/coco_subset/annotations/instances_val_subset.json
  val_img_dir: data/coco_subset/images/val
  n_images: 22500
  img_size: 512
  num_workers: 4

model:
  backbone_name: ijepa_vith14
  pretrained: true
  trainable_backbone_layers: 0

loss:
  det_cls: 1.0
  det_box: 1.0
  seg: 1.0
  cls: 0.5

train:
  device: cuda
  # Diğer omurgalarla AYNI (adil). Cached eğitimde ViT-H forward yok -> sığar.
  # Precompute'ta VRAM darsa: --batch-size 1/2 (feature çıkarma, adilliği etkilemez).
  batch_size: 4
  epochs: 16
  max_steps: null
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  seed: 42
  log_every: 20
  checkpoint_dir: checkpoints
  run_name: colab_ijepa
  checkpoint_every_steps: 500
