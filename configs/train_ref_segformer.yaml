# REFERANS — SegFormer (MiT-B2) semantic-seg specialist, bizim 22.5k'da fine-tuned.
# scripts/train_segformer.py bu config'ten YALNIZCA data + train bloklarını okur (model/loss kullanılmaz;
# model HF'ten --model ile gelir, varsayılan nvidia/mit-b2). Kıyas: multi-task DINOv2 seg (satır 9: 0.6011).
#
#   python scripts/train_segformer.py --config configs/train_ref_segformer.yaml
#
# NOT: img 512 (SegFormer native), lr 6e-5 (SegFormer tipik), batch 4. OOM olursa batch 2.
# ⚠️ REFERANS (kıyas değil): tek-görev + backbone açık + farklı mimari + train-aug açık.
data:
  ann_file: data/coco_subset/annotations/instances_train_subset.json
  img_dir: data/coco_subset/images/train
  val_ann_file: data/coco_subset/annotations/instances_val_subset.json
  val_img_dir: data/coco_subset/images/val
  n_images: 22500
  img_size: 512
  num_workers: 4

train:
  device: cuda
  batch_size: 4
  epochs: 16
  lr: 0.00006          # SegFormer tipik (6e-5)
  weight_decay: 0.0001
  seed: 42
  log_every: 20
  checkpoint_dir: checkpoints
  run_name: ref_segformer
