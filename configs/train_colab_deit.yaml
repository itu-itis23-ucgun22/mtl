# DeiT omurgalı tam koşu - "supervised ViT" paradigma temsilcisi (ROADMAP Faz 1).
# Gövde: DeiT ViT-B/16 (timm deit_base_patch16_224.fb_in1k, SAF supervised in1k - distilled DEĞİL)
# + Simple Feature Pyramid (src/mtl/models/deit_backbone.py).
#
# ⭐ ADİL ÇEKİRDEĞİN SUPERVISED AYAĞI - DINOv1/MAE/CLIP/SAM ile HER EKSENDE aynı:
#   ViT-B (~86M) · patch16 · img 512 · grid 32x32 · ImageNet norm (renorm yok) · SFP · head'ler · batch 4.
#   ResNet'in conv/FPN vs ViT/SFP confound'unu kapatır: "supervised vs SSL" artık AYNI mimaride.
#   Kilit kıyas: DINOv1 (SSL) vs DeiT (supervised) = aynı ViT, farklı pretraining hedefi.
data:
  ann_file: data/coco_subset/annotations/instances_train_subset.json
  img_dir: data/coco_subset/images/train
  val_ann_file: data/coco_subset/annotations/instances_val_subset.json
  val_img_dir: data/coco_subset/images/val
  n_images: 22500
  img_size: 512
  num_workers: 4

model:
  backbone_name: deit_vitb16
  pretrained: true
  trainable_backbone_layers: 0

loss:
  det_cls: 1.0
  det_box: 1.0
  seg: 1.0
  cls: 0.5

train:
  device: cuda
  batch_size: 4
  epochs: 16
  max_steps: null
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  seed: 42
  log_every: 20
  checkpoint_dir: checkpoints
  run_name: colab_deit
  checkpoint_every_steps: 500
