# Fast local CPU sanity check - not a real training run.
data:
  ann_file: data/coco_subset/annotations/instances_train_subset.json
  img_dir: data/coco_subset/images/train
  val_ann_file: data/coco_subset/annotations/instances_val_subset.json
  val_img_dir: data/coco_subset/images/val
  n_images: 20
  img_size: 320
  num_workers: 0

model:
  backbone_name: resnet50
  pretrained: true
  trainable_backbone_layers: 3

loss:
  det_cls: 1.0
  det_box: 1.0
  seg: 1.0
  cls: 0.5

train:
  device: cpu
  batch_size: 2
  epochs: 1
  max_steps: 2
  lr: 0.0001
  weight_decay: 0.0001
  amp: false
  seed: 42
  log_every: 1
  checkpoint_dir: checkpoints
  run_name: smoke
