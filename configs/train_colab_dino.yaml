# DINO omurgalı tam koşu - ResNet konfigüne (train_colab_gpu.yaml) paralel, tek fark
# gövde+neck: DINOv1 ViT-B/16 + Simple Feature Pyramid (bkz. src/mtl/models/dino_backbone.py).
# Sonuçlar ResNet ile karşılaştırılacak (EXPERIMENTS.md "Karşılaştırma" tablosu).
data:
  ann_file: data/coco_subset/annotations/instances_train_subset.json
  img_dir: data/coco_subset/images/train
  val_ann_file: data/coco_subset/annotations/instances_val_subset.json
  val_img_dir: data/coco_subset/images/val
  n_images: 22500
  img_size: 512
  num_workers: 4

model:
  backbone_name: dino_vitb16
  pretrained: true
  # DINO için: eğitilebilir transformer bloğu sayısı (sondan). 0 = ViT tamamen donuk
  # (kanonik SSL kullanımı, en az VRAM/en hızlı, ResNet Deneme 2 ile adil kıyas).
  # Son-N fine-tune denemek için 2 vb. yap (VRAM/süre artar).
  trainable_backbone_layers: 0

loss:
  det_cls: 1.0
  det_box: 1.0
  seg: 1.0
  cls: 0.5

train:
  device: cuda
  # ViT-B/16 @512px = 1024 token, attention O(N^2); stride-4 seg logit'leri de ağır.
  # 12 GB VRAM'de batch 8 büyük olasılıkla OOM -> 4 ile başla. Sığmazsa 2'ye indir,
  # bol yer varsa 8'e çıkar. (AMP açık, donuk ViT aktivasyon saklamadığı için yardımcı.)
  batch_size: 4
  epochs: 16
  max_steps: null
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  seed: 42
  log_every: 20
  checkpoint_dir: checkpoints
  run_name: colab_dino
  checkpoint_every_steps: 500
