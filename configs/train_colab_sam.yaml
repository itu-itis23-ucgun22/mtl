# SAM omurgalı tam koşu - segmentation-native paradigma temsilcisi (ROADMAP Faz 1).
# Gövde: SAM image encoder (timm samvit_base_patch16.sa1b) + Simple Feature Pyramid
# (src/mtl/models/sam_backbone.py). Donuk (layers=0) -> feature-caching akışı.
# NOT: SAM native 1024; burada img_size=512 -> DINOv1/CLIP ile aynı 32x32 grid (adil kıyas).
# Pretrained pozisyonel parametreler (pos_embed + global-attention rel_pos) sam_backbone.py'de
# 512 grid'ine INTERPOLE edilerek yükleniyor (native-1024 strict load şekil hatası verirdi).
data:
  ann_file: data/coco_subset/annotations/instances_train_subset.json
  img_dir: data/coco_subset/images/train
  val_ann_file: data/coco_subset/annotations/instances_val_subset.json
  val_img_dir: data/coco_subset/images/val
  n_images: 22500
  img_size: 512
  num_workers: 4

model:
  backbone_name: sam_vitb16
  pretrained: true
  trainable_backbone_layers: 0

loss:
  det_cls: 1.0
  det_box: 1.0
  seg: 1.0
  cls: 0.5

train:
  device: cuda
  batch_size: 4
  epochs: 16
  max_steps: null
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  seed: 42
  log_every: 20
  checkpoint_dir: checkpoints
  run_name: colab_sam
  checkpoint_every_steps: 500
