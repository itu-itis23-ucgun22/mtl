[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtl"
version = "0.1.0"
description = "Shared ResNet50+FPN backbone for joint detection, segmentation, and classification"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
